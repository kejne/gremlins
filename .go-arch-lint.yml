version: 3
workdir: .
allow:
  depOnAnyVendor: false

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  cobra: { in: github.com/spf13/cobra }
  pflag: { in: github.com/spf13/pflag }
  viper: { in: github.com/spf13/viper }
  homedir: { in: github.com/mitchellh/go-homedir }
  cover: { in: golang.org/x/tools/cover }
  gitdiff: { in: github.com/bluekeyes/go-gitdiff/gitdiff }
  color: { in: github.com/fatih/color }
  durafmt: { in: github.com/hako/durafmt }
  udiff: { in: github.com/aymanbagabas/go-udiff }
  heredoc: { in: github.com/MakeNowJust/heredoc }

components:
  cli: { in: cmd }
  cli-bin: { in: cmd/gremlins/** }
  flags: { in: cmd/internal/flags/** }
  configuration: { in: internal/configuration/** }
  coverage: { in: internal/coverage/** }
  diff: { in: internal/diff/** }
  engine: { in: internal/engine }
  execution-workdir: { in: internal/execution/workdir/** }
  execution-workerpool: { in: internal/execution/workerpool/** }
  exclusion: { in: internal/exclusion/** }
  execution: { in: internal/execution/** }
  gomodule: { in: internal/gomodule/** }
  logging: { in: internal/log/** }
  mutator: { in: internal/mutator/** }
  mutation: { in: internal/mutation/** }
  reporting: { in: internal/report }
  results: { in: internal/results/** }
  report-internal: { in: internal/report/internal/** }

deps:
  cli-bin:
    mayDependOn: [cli, execution, logging, results]
    canUse: [color]
  cli:
    mayDependOn: [cli-bin, configuration, coverage, diff, engine, execution, exclusion, flags, gomodule, logging, mutator, reporting, results]
    canUse: [cobra, pflag, viper, heredoc]
  flags:
    canUse: [cobra, pflag, viper]
  configuration:
    mayDependOn: [mutator]
    canUse: [homedir, viper]
  coverage:
    mayDependOn: [gomodule, logging]
    canUse: [cover]
  diff:
    mayDependOn: [logging]
    canUse: [gitdiff]
  engine:
    mayDependOn: [coverage, diff, exclusion, execution, gomodule, mutation, mutator, reporting, results]
  exclusion:
    canUse: [viper]
  execution-workdir:
    mayDependOn: [logging] # Workspace cleanup diagnostics retain the existing logger.
  execution:
    mayDependOn: [execution-workdir, execution-workerpool, gomodule, logging, mutator, results]
  gomodule:
    mayDependOn: [configuration, logging]
  logging:
    canUse: [color]
  mutation:
    mayDependOn: [coverage, diff, exclusion, gomodule, mutator]
  mutator:
    mayDependOn: [logging]
  reporting:
    mayDependOn: [coverage, diff, exclusion, gomodule, logging, mutator, report-internal, results]
    canUse: [color, durafmt, udiff]
  results:
    mayDependOn: [mutator]
