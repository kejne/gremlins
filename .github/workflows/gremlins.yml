name: Gremlins

on:
  push:
    branches: [ 'main' ]
  pull_request:

jobs:
  gremlins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Run Gremlins against the pull request diff
        if: github.event_name == 'pull_request'
        uses: go-gremlins/gremlins-action@v1
        with:
          version: latest
          args: --silent --diff origin/${{ github.base_ref }}
      - name: Run Gremlins on main
        if: github.event_name == 'push'
        uses: go-gremlins/gremlins-action@v1
        with:
          version: latest
          args: --silent
